services:
  - type: web
    name: creditwise-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11

  - type: web
    name: creditwise-frontend
    runtime: static
    plan: free
    buildCommand: ""
    staticPublishPath: "./frontend"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
